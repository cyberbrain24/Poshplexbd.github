# ============================================================
# Poshplex Host-Level Nginx Configuration
# Place this file in /etc/nginx/sites-available/poshplex
# ============================================================

# Connection pooling for high throughput
upstream django_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream nextjs_storefront {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ------------------------------------------------------------
# 1. Storefront & API Server Block (store.poshplexbd.com)
# ------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name store.poshplexbd.com;

    # Certbot will automatically inject SSL config here later

    # Max upload size for products/images
    client_max_body_size 50M;

    # Gzip settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # -----------------------------
    # Django Backend Routes
    # -----------------------------
    location /api/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_addrs_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_addrs_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Docker Volumes mapping directly to host (Requires Docker volume paths)
    # The actual path depends on Docker's volume mount point on the host.
    # Usually: /var/lib/docker/volumes/poshplexbdgithub_media_files/_data
    # You MUST replace the path below with your actual docker volume path!
    location /media/ {
        alias /var/lib/docker/volumes/poshplexbdgithub_media_files/_data/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /static/ {
        alias /var/lib/docker/volumes/poshplexbdgithub_static_files/_data/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # -----------------------------
    # Next.js Storefront (Catch-all)
    # -----------------------------
    location / {
        proxy_pass http://nextjs_storefront;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_addrs_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------
# 2. React Vite Admin SPA Server Block (admin.poshplexbd.com)
# ------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name admin.poshplexbd.com;

    # Certbot will automatically inject SSL config here later

    root /var/www/poshplex_admin;
    index index.html index.htm;

    # Gzip settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache static assets aggressively
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }
}
