# ============================================================
# Poshplex Host-Level Nginx Configuration
# Place this file in /etc/nginx/sites-available/poshplex
# ============================================================

# Connection pooling for high throughput
upstream django_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream nextjs_storefront {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream vite_admin {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream docker_nginx {
    server 127.0.0.1:8080;
    keepalive 32;
}

# CORS allowed origins mapping for API routes
map $http_origin $cors_origin {
    default "";
    "~^https?://(admin\.|store\.)?poshplexbd\.com$" "$http_origin";
    "~^http://localhost(:[0-9]+)?$" "$http_origin";
    "~^http://127\.0\.0\.1(:[0-9]+)?$" "$http_origin";
    "~^http://192\.168\.[0-9]+\.[0-9]+(:[0-9]+)?$" "$http_origin";
}

# ------------------------------------------------------------
# 0. Catch-all block for bots and direct IP access
# ------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    # We drop the request immediately without returning any data
    server_name _;
    return 444; 
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# ------------------------------------------------------------
# 1. Storefront & API Server Block (poshplexbd.com)
# ------------------------------------------------------------
server {
    server_name poshplexbd.com api.poshplexbd.com media.poshplexbd.com;

    # Certbot will automatically inject SSL config here later

    # Max upload size for products/images
    client_max_body_size 50M;

    # Compression settings
    gzip off;
    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # -----------------------------
    # Cloudflare Real IP Restoration
    # -----------------------------
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    # -----------------------------
    # Django Backend Routes
    # -----------------------------
    # Only /api/v1/ goes to Django. Other /api/* paths (like /api/fb-capi)
    # are Next.js API routes and fall through to the storefront below.
    location /api/v1/ {
        # Instant Nginx-level CORS preflight response (<1ms latency)
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, Accept, Origin, Cache-Control, Pragma, X-CSRFToken' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://django_backend/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header True-Client-IP $http_true_client_ip;

        # Resilient error fallback: return valid JSON with CORS if backend restarts
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_50x;
    }

    location @api_50x {
        default_type application/json;
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Cache-Control' 'no-store, no-cache, must-revalidate, max-age=0' always;
        return 502 '{"detail":"Backend service is temporarily restarting. Please retry in a moment.","error":"upstream_unavailable"}';
    }

    location /admin/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://docker_nginx;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /static/ {
        proxy_pass http://docker_nginx;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /_next/static/ {
        proxy_pass http://nextjs_storefront;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # -----------------------------
    # Next.js Storefront (Catch-all)
    # -----------------------------
    location / {
        proxy_pass http://nextjs_storefront;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header True-Client-IP $http_true_client_ip;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/poshplexbd.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/poshplexbd.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# ------------------------------------------------------------
# 2. React Vite Admin SPA Server Block (admin.poshplexbd.com)
# ------------------------------------------------------------
server {
    server_name admin.poshplexbd.com;

    # Certbot will automatically inject SSL config here later

    # gzip off; # Disabled globally, but we can explicitly turn it off here too
    gzip off;
    
    # Brotli Compression
    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA Routing Fallback
    location / {
        proxy_pass http://vite_admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        proxy_pass http://vite_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }



    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.poshplexbd.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.poshplexbd.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = poshplexbd.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name poshplexbd.com;
    return 404; # managed by Certbot


}
server {
    if ($host = admin.poshplexbd.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name admin.poshplexbd.com;
    return 404; # managed by Certbot


}
