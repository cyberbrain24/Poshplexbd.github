version: "3.9"

# ============================================================
# Poshplex Enterprise Environment (Contabo 12GB VPS)
# Highly Optimized for RAM, Host Nginx, and Background Workers
# ============================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: poshplex_postgres
    restart: always
    # Aggressively tuned for 12GB RAM VPS
    command: >
      postgres 
      -c shared_buffers=4GB 
      -c effective_cache_size=8GB 
      -c work_mem=64MB 
      -c maintenance_work_mem=512MB 
      -c random_page_cost=1.1
    env_file:
      - .env
    environment:
      POSTGRES_DB: poshplex
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Bound to localhost so only host can access
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-poshplex_user} -d poshplex"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 6G

  redis:
    image: redis/redis-stack-server:latest
    container_name: poshplex_redis
    restart: always
    # Configured as a pure LRU cache with exactly 2GB RAM
    command: redis-server --maxmemory 2000mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redis_data:/data
    ports:
      # Bound to localhost so only host can access
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2G

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: poshplex_backend
    restart: always
    env_file:
      - .env
    command: >
      sh -c "
        python manage.py collectstatic --noinput &&
        python manage.py migrate --noinput &&
        gunicorn poshplex.wsgi:application --bind 0.0.0.0:8000 --workers 8 --threads 2 --worker-class gthread --keep-alive 5 --access-logfile - --error-logfile -
      "
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    ports:
      # Exposed exclusively to host loopback for host-Nginx to reverse proxy
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: poshplex_worker
    restart: always
    env_file:
      - .env
    command: >
      sh -c "
        celery -A poshplex worker -l info --concurrency=4
      "
    volumes:
      - media_files:/app/media
    depends_on:
      - backend
      - redis
    deploy:
      resources:
        limits:
          memory: 512M

  store:
    build:
      context: ./poshplex_store
      dockerfile: Dockerfile
    container_name: poshplex_store
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: "${PUBLIC_API_URL:-http://localhost/api/v1}"
      REDIS_URL: "redis://redis:6379/1"
    ports:
      # Exposed exclusively to host loopback for host-Nginx to reverse proxy
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_data:
  redis_data:
  media_files:
  static_files:
