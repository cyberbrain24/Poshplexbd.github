version: "3.9"

# ============================================================
# Poshplex Production Environment (VPS Deployment)
# Optimized for Memory Limits & High Performance
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: poshplex_postgres
    restart: always
    command: postgres -c shared_buffers=1GB -c effective_cache_size=2GB
    env_file:
      - .env
    environment:
      POSTGRES_DB: poshplex
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-poshplex_user} -d poshplex"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis/redis-stack-server:latest
    container_name: poshplex_redis
    restart: always
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: poshplex_backend
    restart: always
    env_file:
      - .env
    command: >
      sh -c "
        python manage.py collectstatic --noinput &&
        python manage.py migrate --noinput &&
        gunicorn poshplex.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --access-logfile - --error-logfile -
      "
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: poshplex_worker
    restart: always
    env_file:
      - .env
    command: >
      sh -c "
        celery -A poshplex worker -l info --concurrency=2
      "
    volumes:
      - media_files:/app/media
    depends_on:
      - backend
      - redis
    deploy:
      resources:
        limits:
          memory: 256M

  nginx:
    image: nginx:alpine
    container_name: poshplex_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - media_files:/usr/share/nginx/html/media:ro
      - static_files:/usr/share/nginx/html/static:ro
    depends_on:
      - backend
      - store
      - admin

  store:
    build:
      context: ./poshplex_store
      dockerfile: Dockerfile
    container_name: poshplex_store
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost/api/v1"
      REDIS_URL: "redis://redis:6379/1"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M

  admin:
    build:
      context: ./poshplex_admin
      dockerfile: Dockerfile
    container_name: poshplex_admin
    restart: always
    environment:
      VITE_API_URL: "http://localhost/api/v1"
    ports:
      - "3001:3001"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
  redis_data:
  media_files:
  static_files:
