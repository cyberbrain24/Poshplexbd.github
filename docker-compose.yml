version: "3.9"

# ============================================================
# Poshplex Full-Stack Local & Production Environment
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL 16 — Primary Application Database
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: poshplex_postgres
    restart: unless-stopped
    command: postgres -c shared_buffers=4GB -c effective_cache_size=8GB -c shared_preload_libraries='pg_prewarm'
    env_file:
      - .env
    environment:
      POSTGRES_DB: poshplex
      # POSTGRES_USER and POSTGRES_PASSWORD should be in .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-poshplex_user} -d poshplex"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------
  # Redis Stack Server — RediSearch, RedisJSON, Cache
  # ----------------------------------------------------------
  redis:
    image: redis/redis-stack-server:latest
    container_name: poshplex_redis
    restart: unless-stopped
    environment:
      REDIS_ARGS: "--maxmemory 2000mb --maxmemory-policy allkeys-lru"
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ----------------------------------------------------------
  # Django Ninja Backend — Gunicorn
  # ----------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: poshplex_backend
    restart: unless-stopped
    env_file:
      - .env
    command: >
      sh -c "
        python manage.py collectstatic --noinput &&
        python manage.py migrate --noinput &&
        gunicorn poshplex.wsgi:application --bind 0.0.0.0:8000 --workers 8 --threads 2 --worker-class gthread
      "
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------------
  # Celery Worker — Background Tasks (SMS, Courier, Webhooks)
  # ----------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: poshplex_worker
    restart: unless-stopped
    env_file:
      - .env
    command: >
      sh -c "
        celery -A poshplex worker -l info --concurrency=2 --max-tasks-per-child=100
      "
    volumes:
      - media_files:/app/media
    depends_on:
      - backend
      - redis


  # ----------------------------------------------------------
  # Nginx Reverse Proxy
  # ----------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: poshplex_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - media_files:/usr/share/nginx/html/media:ro
      - static_files:/usr/share/nginx/html/static:ro
    depends_on:
      - backend
      - store
      - admin

  # ----------------------------------------------------------
  # Next.js Storefront — Port 3000
  # ----------------------------------------------------------
  store:
    build:
      context: ./poshplex_store
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "https://store.poshplexbd.com"
    container_name: poshplex_store
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: "https://store.poshplexbd.com"
      REDIS_URL: "redis://redis:6379/1"
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # ----------------------------------------------------------
  # Vite Admin Panel — Port 3001
  # ----------------------------------------------------------
  admin:
    build:
      context: ./poshplex_admin
      dockerfile: Dockerfile
    container_name: poshplex_admin
    restart: unless-stopped
    environment:
      VITE_API_URL: "https://admin.poshplexbd.com/api/v1"
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  media_files:
  static_files:
